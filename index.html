<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>한국어·문화 학습 퀴즈</title>
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="한국어퀴즈">
  <meta name="description" content="한국어와 한국 문화를 학습하는 퀴즈 앱">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="quiz_image.png">
  <!-- Gemini API를 사용하기 위한 SDK 추가 -->
<script type="importmap">
  {
    "imports": {
      "@google/generative-ai": "https://esm.run/@google/generative-ai"
    }
  }
</script>
  
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --success: #16a34a;
      --danger: #dc2626;
      --warning: #d97706;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --radius: 16px;
      --shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      /* iOS 노치·홈바 영역 확보 */
      padding-bottom: env(safe-area-inset-bottom);
    }
    .screen {
      display: none; min-height: 100vh;
      padding: 16px;
      padding-top: calc(16px + env(safe-area-inset-top));
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
      padding-left: calc(16px + env(safe-area-inset-left));
      padding-right: calc(16px + env(safe-area-inset-right));
      max-width: 680px; margin: 0 auto;
    }
    .screen.active { display: block; }

    /* ─── 공통 카드 ─── */
    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      margin-bottom: 16px;
    }
    h1 { font-size: 1.6rem; font-weight: 800; color: var(--primary); margin-bottom: 4px; }
    h2 { font-size: 1.2rem; font-weight: 700; margin-bottom: 12px; }
    h3 { font-size: 1rem; font-weight: 700; margin-bottom: 8px; }
    .subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }

    /* ─── 버튼 ─── */
    .btn {
      display: block; width: 100%; padding: 14px 20px;
      border: none; border-radius: 12px;
      font-size: 1rem; font-weight: 700; cursor: pointer;
      transition: all 0.15s; text-align: center; text-decoration: none;
      margin-bottom: 10px;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-success { background: var(--success); color: #fff; }
    .btn-outline {
      background: transparent; color: var(--primary);
      border: 2px solid var(--primary);
    }
    .btn-outline:hover { background: var(--primary); color: #fff; }
    .btn-sm { padding: 8px 16px; font-size: 0.875rem; margin-bottom: 6px; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-gray { background: var(--border); color: var(--text); }
    .btn-row { display: flex; gap: 10px; }
    .btn-row .btn { flex: 1; }

    /* ─── 입력 ─── */
    input[type="text"] {
      width: 100%; padding: 14px 16px;
      border: 2px solid var(--border); border-radius: 12px;
      font-size: 1rem; outline: none; transition: border 0.2s;
      margin-bottom: 12px;
    }
    input[type="text"]:focus { border-color: var(--primary); }

    /* ─── 선택 그룹 ─── */
    .option-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .option-btn {
      padding: 8px 16px; border-radius: 20px;
      border: 2px solid var(--border); background: #fff;
      font-size: 0.9rem; cursor: pointer; transition: all 0.15s;
      font-weight: 600;
    }
    .option-btn.selected { background: var(--primary); color: #fff; border-color: var(--primary); }
    .option-btn:active { transform: scale(0.95); }

    /* ─── 퀴즈 화면 ─── */
    .progress-bar { height: 8px; background: var(--border); border-radius: 99px; margin-bottom: 8px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--primary); border-radius: 99px; transition: width 0.4s; }
    .progress-text { font-size: 0.85rem; color: var(--muted); text-align: right; margin-bottom: 16px; }

    .question-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .badge {
      padding: 4px 10px; border-radius: 99px; font-size: 0.75rem; font-weight: 700;
    }
    .badge-unit { background: #eff6ff; color: #1d4ed8; }
    .badge-easy { background: #dcfce7; color: #15803d; }
    .badge-medium { background: #fef9c3; color: #a16207; }
    .badge-hard { background: #fee2e2; color: #b91c1c; }
    .badge-type { background: #f1f5f9; color: var(--muted); }

    .question-text { font-size: 1.1rem; font-weight: 700; line-height: 1.6; margin-bottom: 20px; }

    .choice-btn {
      width: 100%; text-align: left; padding: 14px 16px;
      border: 2px solid var(--border); border-radius: 12px;
      background: #fff; font-size: 0.95rem; cursor: pointer;
      transition: all 0.15s; margin-bottom: 10px; font-weight: 500;
      display: flex; align-items: center; gap: 12px; line-height: 1.4;
    }
    .choice-btn .choice-label {
      min-width: 28px; height: 28px; border-radius: 50%;
      background: var(--border); display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 0.85rem; flex-shrink: 0;
    }
    .choice-btn:hover:not(:disabled) { border-color: var(--primary); background: #eff6ff; }
    .choice-btn.correct { border-color: var(--success); background: #f0fdf4; }
    .choice-btn.correct .choice-label { background: var(--success); color: #fff; }
    .choice-btn.wrong { border-color: var(--danger); background: #fff1f1; }
    .choice-btn.wrong .choice-label { background: var(--danger); color: #fff; }
    .choice-btn:disabled { cursor: default; }

    .explanation-box {
      background: #f0fdf4; border-left: 4px solid var(--success);
      border-radius: 8px; padding: 14px 16px; margin-top: 12px;
      font-size: 0.9rem; line-height: 1.6;
    }
    .explanation-box.wrong-exp { background: #fff7ed; border-left-color: var(--warning); }

    /* ─── 결과 화면 ─── */
    .score-circle {
      width: 120px; height: 120px; border-radius: 50%;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      margin: 0 auto 20px; color: #fff;
    }
    .score-num { font-size: 2rem; font-weight: 900; }
    .score-label { font-size: 0.75rem; opacity: 0.85; }

    .stat-row { display: flex; justify-content: space-around; margin-bottom: 16px; }
    .stat-item { text-align: center; }
    .stat-val { font-size: 1.4rem; font-weight: 800; color: var(--primary); }
    .stat-lbl { font-size: 0.8rem; color: var(--muted); }

    .unit-row {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 0.9rem;
    }
    .unit-row:last-child { border-bottom: none; }
    .unit-bar-wrap { flex: 1; height: 8px; background: var(--border); border-radius: 99px; overflow: hidden; }
    .unit-bar { height: 100%; border-radius: 99px; background: var(--primary); transition: width 0.6s; }
    .unit-pct { min-width: 40px; text-align: right; font-weight: 700; font-size: 0.85rem; }

    .wrong-item {
      background: #fff1f1; border-radius: 10px; padding: 12px 14px;
      margin-bottom: 8px; font-size: 0.9rem;
    }
    .wrong-q { font-weight: 600; margin-bottom: 4px; }
    .wrong-ans { color: var(--muted); font-size: 0.82rem; }

    /* ─── AI 유사문제 ─── */
    .ai-question-item {
      background: #f0f7ff; border-radius: 10px; padding: 14px 16px;
      margin-bottom: 12px; font-size: 0.9rem; border-left: 4px solid var(--primary);
    }
    .ai-q-num { font-size: 0.75rem; color: var(--primary); font-weight: 700; margin-bottom: 6px; }
    .ai-q-text { font-weight: 600; margin-bottom: 10px; line-height: 1.5; }
    .ai-choices { margin: 0 0 10px 16px; padding: 0; }
    .ai-choices li { padding: 4px 0; color: var(--muted); }
    .ai-choices li.ai-correct { color: var(--success); font-weight: 700; }
    .ai-explanation { font-size: 0.82rem; color: #6b5e00; background: #fffbeb; border-radius: 6px; padding: 8px 10px; }

    /* ─── 이력 화면 ─── */
    .history-card {
      background: #fff; border-radius: 12px; border: 1px solid var(--border);
      padding: 14px 16px; margin-bottom: 10px;
    }
    .history-meta { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }
    .history-score { font-size: 1.3rem; font-weight: 800; color: var(--primary); }
    .history-date { font-size: 0.8rem; color: var(--muted); }

    /* ─── 로딩 ─── */
    .loading {
      position: fixed; inset: 0; background: rgba(255,255,255,0.85);
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 12px; z-index: 999;
    }
    .spinner {
      width: 48px; height: 48px; border: 5px solid var(--border);
      border-top-color: var(--primary); border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── 헤더 ─── */
    .top-bar {
      display: flex; align-items: center; gap: 10px; margin-bottom: 20px;
    }
    .back-btn {
      background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text);
      padding: 4px 8px; border-radius: 8px;
    }
    .back-btn:hover { background: var(--border); }

    /* ─── 탭 ─── */
    .tab-bar {
      display: flex; gap: 4px; background: var(--border); border-radius: 10px; padding: 4px;
      margin-bottom: 16px;
    }
    .tab-btn {
      flex: 1; padding: 8px; border: none; border-radius: 8px; background: none;
      font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.15s; color: var(--muted);
    }
    .tab-btn.active { background: #fff; color: var(--primary); box-shadow: 0 2px 8px rgba(0,0,0,0.08); }

    .empty-state { text-align: center; color: var(--muted); padding: 40px 0; }
    .empty-icon { font-size: 3rem; margin-bottom: 10px; }

    /* ─── 모바일 ─── */
    @media (max-width: 480px) {
      .screen { padding: 12px; padding-top: calc(12px + env(safe-area-inset-top)); padding-bottom: calc(20px + env(safe-area-inset-bottom)); }
      .card { padding: 16px; }
      h1 { font-size: 1.25rem; }
      h2 { font-size: 1.1rem; }
      .score-num { font-size: 1.6rem; }
      .option-btn { padding: 9px 13px; font-size: 0.85rem; }
      .question-text { font-size: 1rem; }
      .choice-btn { padding: 13px 13px; font-size: 0.9rem; }
      .btn { padding: 15px 16px; font-size: 0.95rem; }
      .stat-val { font-size: 1.2rem; }
      .score-circle { width: 100px; height: 100px; }
    }
    @media (max-width: 360px) {
      h1 { font-size: 1.1rem; }
      .option-btn { padding: 8px 10px; font-size: 0.8rem; }
    }
  </style>
</head>
<body>

<!-- 로딩 오버레이 -->
<div class="loading" id="loadingOverlay">
  <div class="spinner"></div>
  <div>문제를 불러오는 중...</div>
</div>

<!-- ────────────────────────────────
     화면 1: 시작
──────────────────────────────── -->
<div class="screen" id="screenStart">
  <div class="card" style="text-align:center; padding-top: 32px;">
    <img src="quiz_image.png" alt="퀴즈 로고" style="width: 80px; height: auto; margin-bottom: 10px;">
    <h1>한국어·문화 퀴즈</h1>
    <p class="subtitle">공부한 내용을 확인해 볼까요?<br>틀린문제는 "오답 복습"에서 다시!!</p>
  </div>

  <div class="card">
    <h3>👤 이름 / 사번</h3>
    <div style="display:flex; gap:10px; margin-bottom:12px;">
      <input type="text" id="inputName" placeholder="이름 (한글 10자)" maxlength="10"
             style="flex:1.5; margin-bottom:0;">
      <input type="text" id="inputEmpId" placeholder="사번 (숫자 6자리)" maxlength="6"
             inputmode="numeric" style="flex:1; margin-bottom:0;">
    </div>

    <h3>📘 레벨 선택</h3>
    <div class="option-group" id="levelSelectGroup">
      <button class="option-btn selected" data-val="quiz1">기초</button>
      <button class="option-btn" data-val="quiz2">초급1</button>
      <button class="option-btn" data-val="quiz3">초급2</button>
      <button class="option-btn" data-val="quiz4">중급1</button>
      <button class="option-btn" data-val="quiz5">중급2</button>
    </div>

    <h3>📖 퀴즈 모드 선택</h3>
    <div class="option-group" id="modeGroup">
      <button class="option-btn selected" data-val="all">전체 랜덤</button>
      <button class="option-btn" data-val="unit">단원별</button>
      <button class="option-btn" data-val="wrong">오답 복습</button>
    </div>

    <div id="unitSelector" style="display:none;">
      <h3>📂 단원 선택 <span style="font-weight:400;font-size:0.85rem;color:var(--muted)">(복수 선택 가능)</span></h3>
      <div class="option-group" id="unitGroup"></div>
    </div>

    <h3>🔢 문제 수</h3>
    <div class="option-group" id="countGroup">
      <button class="option-btn selected" data-val="5">5개</button>
      <button class="option-btn" data-val="10">10개</button>
      <button class="option-btn" data-val="20">20개</button>
      <button class="option-btn" data-val="all">전체</button>
    </div>

    <h3>⚡ 난이도 필터 (선택)</h3>
    <div class="option-group" id="levelGroup">
      <button class="option-btn selected" data-val="all">전체</button>
      <button class="option-btn" data-val="easy">쉬움</button>
      <button class="option-btn" data-val="medium">보통</button>
      <button class="option-btn" data-val="hard">어려움</button>
    </div>

    <button class="btn btn-primary" onclick="startQuiz()" style="margin-top:8px;">
      ▶ 퀴즈 시작하기
    </button>
    <button class="btn btn-outline" onclick="showScreen('screenHistory')">
      📊 학습 이력 보기
    </button>
  </div>

  <p style="text-align:center;font-size:0.8rem;color:var(--muted);">
    ⚠️ 학습 데이터는 이 기기의 브라우저에만 저장됩니다
  </p>
</div>

<!-- ────────────────────────────────
     화면 2: 퀴즈
──────────────────────────────── -->
<div class="screen" id="screenQuiz">
  <div class="top-bar">
    <button class="back-btn" onclick="confirmExit()">←</button>
    <span id="quizTitle" style="font-weight:700; font-size:1rem;"></span>
  </div>

  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-text" id="progressText"></div>

  <div class="card" id="questionCard">
    <div class="question-meta" id="questionMeta"></div>
    <div class="question-text" id="questionText"></div>
    <div id="choicesArea"></div>
    <div id="explanationArea" style="display:none;"></div>
  </div>

  <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display:none;">
    다음 문제 →
  </button>
</div>

<!-- ────────────────────────────────
     화면 3: 결과
──────────────────────────────── -->
<div class="screen" id="screenResult">
  <div class="card" style="text-align:center;">
    <h2>🎉 퀴즈 완료!</h2>
    <div class="score-circle">
      <span class="score-num" id="resultScore">0</span>
      <span class="score-label">점</span>
    </div>
    <div class="stat-row">
      <div class="stat-item">
        <div class="stat-val" id="resultAccuracy">0%</div>
        <div class="stat-lbl">정답률</div>
      </div>
      <div class="stat-item">
        <div class="stat-val" id="resultCorrect">0/0</div>
        <div class="stat-lbl">맞힌 문제</div>
      </div>
      <div class="stat-item">
        <div class="stat-val" id="resultGrade">-</div>
        <div class="stat-lbl">등급</div>
      </div>
    </div>
    <p id="resultMessage" style="color:var(--muted);font-size:0.9rem;"></p>
  </div>

  <div class="card">
    <h3>📂 단원별 결과</h3>
    <div id="unitStats"></div>
  </div>

  <div class="card" id="wrongListCard" style="display:none;">
    <h3>❌ 틀린 문제 목록</h3>
    <div id="wrongList"></div>
    <button class="btn btn-outline" id="aiGenerateBtn" onclick="generateAISimilarQuestions()" style="margin-top:12px;width:100%;">🤖 AI 유사문제 생성</button>
  </div>

  <div class="card" id="aiGeneratedCard" style="display:none;">
    <h3>🤖 AI 생성 유사문제</h3>
    <div id="aiGeneratedList"></div>
  </div>

  <div class="btn-row">
    <button class="btn btn-primary" onclick="restartSame()">🔄 다시 풀기</button>
    <button class="btn btn-outline" onclick="retryWrong()" id="retryWrongBtn">❌ 오답만</button>
  </div>
  <button class="btn btn-gray" onclick="goHome()">🏠 처음으로</button>
  <button class="btn btn-outline" onclick="showScreen('screenHistory')">📊 학습 이력</button>
</div>

<!-- ────────────────────────────────
     화면 4: 학습 이력
──────────────────────────────── -->
<div class="screen" id="screenHistory">
  <div class="top-bar">
    <button class="back-btn" onclick="showScreen('screenStart')">←</button>
    <h2 style="margin:0;">📊 학습 이력</h2>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('mine')" id="tabMine">내 기록</button>
    <button class="tab-btn" onclick="switchTab('all')" id="tabAll">전체 학생</button>
  </div>

  <div id="tabContentMine">
    <div id="myNameInfo" class="card" style="display:none;padding:12px 16px;"></div>
    <div id="myHistoryList"></div>
  </div>

  <div id="tabContentAll" style="display:none;">
    <div class="card" style="padding:12px 16px;">
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">
        <span style="font-weight:700;">전체 학생 기록</span>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn btn-outline btn-sm" onclick="exportCSV()">📥 CSV 다운로드</button>
          <button class="btn btn-danger btn-sm" onclick="clearAllData()">🗑 전체 초기화</button>
        </div>
      </div>
    </div>
    <div id="allHistoryList"></div>
  </div>
</div>

<script>
// ────────────────────────────────
// 전역 상태
// ────────────────────────────────
let allQuestions = [];
let quizQuestions = [];
let currentIdx = 0;
let studentName = '';
let empId = '';
let answers = [];       // {id, correct, chosen, answer}
let quizMode = 'all';
let selectedUnits = [];
let questionCount = 5;
let levelFilter = 'all';
let sessionAttemptId = null;
let selectedQuizFile = 'quiz0.json';
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw7_bBwy9qnGnC2U8_ZjOE6m_1c1DNCUczQ4Mq1ZEEwKUfwNPWjWLQCbZoBvoSVZLFx/exec";
// ────────────────────────────────
// 초기화
// ────────────────────────────────
document.addEventListener('DOMContentLoaded', async () => {
  setupOptionGroups();
  await loadQuestions(selectedQuizFile);
  document.getElementById('loadingOverlay').style.display = 'none';
  showScreen('screenStart');
  restoreLastName();
});

async function loadQuestions(filename = 'quiz0.json') {
  try {
    const res = await fetch(filename);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    allQuestions = await res.json();
    buildUnitButtons();
  } catch (e) {
    allQuestions = [];
    alert('❗ ' + filename + ' 파일을 불러오지 못했습니다.\n같은 폴더에 파일이 있는지 확인하세요.\n오류: ' + e.message);
  }
}

function buildUnitButtons() {
  const units = [...new Set(allQuestions.map(q => q.unit))].sort((a, b) => {
    const n = s => parseInt(s.match(/\d+/)?.[0] ?? 0);
    return n(a) - n(b);
  });
  const wrap = document.getElementById('unitGroup');
  wrap.innerHTML = '';
  units.forEach(u => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.dataset.val = u;
    btn.textContent = u;
    btn.onclick = () => toggleUnit(btn, u);
    wrap.appendChild(btn);
  });
}

function toggleUnit(btn, unit) {
  btn.classList.toggle('selected');
  if (btn.classList.contains('selected')) {
    selectedUnits.push(unit);
  } else {
    selectedUnits = selectedUnits.filter(u => u !== unit);
  }
}

function setupOptionGroups() {
  setupSingleSelect('levelSelectGroup', v => {
    selectedQuizFile = v + '.json';
    selectedUnits = [];
    loadQuestions(selectedQuizFile);
  });
  setupSingleSelect('modeGroup', v => {
    quizMode = v;
    document.getElementById('unitSelector').style.display = v === 'unit' ? 'block' : 'none';
  });
  setupSingleSelect('countGroup', v => questionCount = v);
  setupSingleSelect('levelGroup', v => levelFilter = v);
}

function setupSingleSelect(groupId, onChange) {
  document.getElementById(groupId).addEventListener('click', e => {
    const btn = e.target.closest('.option-btn');
    if (!btn) return;
    [...document.querySelectorAll(`#${groupId} .option-btn`)].forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    onChange(btn.dataset.val);
  });
}

function restoreLastName() {
  const savedName = localStorage.getItem('kq_last_name');
  if (savedName) document.getElementById('inputName').value = savedName;
  const savedEmp = localStorage.getItem('kq_last_empid');
  if (savedEmp) document.getElementById('inputEmpId').value = savedEmp;

  // 이름: 한글만 허용, 10자 제한 — compositionend·blur 시점에 필터 (IME 조합 중 간섭 방지)
  const nameEl = document.getElementById('inputName');
  const filterName = function () {
    this.value = this.value.replace(/[^가-힣\s]/g, '').slice(0, 10);
  };
  nameEl.addEventListener('compositionend', filterName);
  nameEl.addEventListener('blur', filterName);

  // 사번: 숫자만 허용, 6자 제한
  document.getElementById('inputEmpId').addEventListener('input', function () {
    this.value = this.value.replace(/\D/g, '').slice(0, 6);
  });

// ────────────────────────────────
// 화면 전환
// ────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
  if (id === 'screenHistory') renderHistory();

// ────────────────────────────────
// 퀴즈 시작
// ────────────────────────────────
function startQuiz() {
  studentName = document.getElementById('inputName').value.trim();
  if (!studentName) { alert('이름을 입력해 주세요.'); return; }
  if (!/^[가-힣\s]{1,10}$/.test(studentName)) { alert('이름은 한글 10자 이내로 입력해 주세요.'); return; }

  empId = document.getElementById('inputEmpId').value.trim();
  if (!/^\d{6}$/.test(empId)) { alert('사번을 숫자 6자리로 입력해 주세요.'); return; }

  localStorage.setItem('kq_last_name', studentName);
  localStorage.setItem('kq_last_empid', empId);

  let pool = [...allQuestions];

  // 레벨 필터
  if (levelFilter !== 'all') pool = pool.filter(q => q.level === levelFilter);

  // 모드 필터
  if (quizMode === 'unit') {
    if (selectedUnits.length === 0) { alert('단원을 하나 이상 선택해 주세요.'); return; }
    pool = pool.filter(q => selectedUnits.includes(q.unit));
  } else if (quizMode === 'wrong') {
    const wrongIds = getMyWrongIds();
    if (wrongIds.length === 0) { alert('아직 틀린 문제가 없어요. 먼저 퀴즈를 풀어보세요.'); return; }
    pool = pool.filter(q => wrongIds.includes(q.id));
  }

  if (pool.length === 0) { alert('조건에 맞는 문제가 없습니다. 필터를 조정해 보세요.'); return; }

  shuffle(pool);
  const cnt = questionCount === 'all' ? pool.length : Math.min(parseInt(questionCount), pool.length);
  quizQuestions = pool.slice(0, cnt);

  currentIdx = 0;
  answers = [];
  sessionAttemptId = Date.now().toString();

  const levelNames = {'quiz0.json':'기초','quiz1.json':'초급1','quiz2.json':'초급2','quiz3.json':'중급1','quiz4.json':'중급2'};
  const levelTag = `[${levelNames[selectedQuizFile]}] `;
  document.getElementById('quizTitle').textContent = levelTag + (
    quizMode === 'all' ? '전체 랜덤 퀴즈' :
    quizMode === 'unit' ? '단원별 퀴즈' : '오답 복습 퀴즈');

  showScreen('screenQuiz');
  renderQuestion();
}

// ────────────────────────────────
// 문제 렌더링
// ────────────────────────────────
function renderQuestion() {
  const q = quizQuestions[currentIdx];
  const total = quizQuestions.length;
  const pct = ((currentIdx) / total * 100).toFixed(0);

  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${currentIdx + 1} / ${total}`;

  const levelMap = { easy: '쉬움', medium: '보통', hard: '어려움' };
  const typeMap = {
    multiple_choice: '객관식', true_false: 'O/X',
    fill_blank: '빈칸 채우기', vocabulary: '어휘',
    situation: '상황 표현', reading: '독해'
  };

  document.getElementById('questionMeta').innerHTML = `
    <span class="badge badge-unit">${q.unit.split(':')[0]}</span>
    <span class="badge badge-${q.level}">${levelMap[q.level]}</span>
    <span class="badge badge-type">${typeMap[q.type] || q.type}</span>
  `;
  document.getElementById('questionText').textContent = q.question;

  // 선택지 섞기
  const choices = q.type === 'true_false' ? ['O', 'X'] : shuffle([...q.choices]);
  const labels = ['①', '②', '③', '④', '⑤'];

  const area = document.getElementById('choicesArea');
  area.innerHTML = '';
  choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = `<span class="choice-label">${labels[i]}</span><span>${c}</span>`;
    btn.onclick = () => selectAnswer(c, btn);
    area.appendChild(btn);
  });

  document.getElementById('explanationArea').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'none';
}

function selectAnswer(chosen, clickedBtn) {
  const q = quizQuestions[currentIdx];
  const correct = chosen === q.answer;
  answers.push({ id: q.id, unit: q.unit, correct, chosen, answer: q.answer });

  // 모든 버튼 비활성화 및 정답 표시
  const allBtns = document.querySelectorAll('.choice-btn');
  allBtns.forEach(btn => {
    btn.disabled = true;
    const txt = btn.querySelector('span:last-child').textContent;
    if (txt === q.answer) btn.classList.add('correct');
  });
  if (!correct) clickedBtn.classList.add('wrong');

  // 해설 표시
  const expArea = document.getElementById('explanationArea');
  expArea.style.display = 'block';
  expArea.className = 'explanation-box' + (correct ? '' : ' wrong-exp');
  expArea.innerHTML = `
    <strong>${correct ? '✅ 정답입니다!' : '❌ 오답입니다.'}</strong><br>
    <strong>정답:</strong> ${q.answer}<br>
    <strong>해설:</strong> ${q.explanation}
  `;

  // 다음 버튼
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.style.display = 'block';
  nextBtn.textContent = currentIdx + 1 < quizQuestions.length ? '다음 문제 →' : '결과 보기 →';
}

function nextQuestion() {
  currentIdx++;
  if (currentIdx < quizQuestions.length) {
    renderQuestion();
    window.scrollTo(0, 0);
  } else {
    finishQuiz();
  }
}

function confirmExit() {
  if (confirm('퀴즈를 중단하고 처음으로 돌아가시겠어요?')) goHome();
}

// ────────────────────────────────
// 결과 처리
// ────────────────────────────────
function finishQuiz() {
  const total = quizQuestions.length;
  const correctCount = answers.filter(a => a.correct).length;
  const accuracy = total > 0 ? Math.round(correctCount / total * 100) : 0;
  const score = accuracy;

  // 단원별 통계
  const unitStats = {};
  answers.forEach(a => {
    if (!unitStats[a.unit]) unitStats[a.unit] = { total: 0, correct: 0 };
    unitStats[a.unit].total++;
    if (a.correct) unitStats[a.unit].correct++;
  });
  Object.keys(unitStats).forEach(u => {
    unitStats[u].accuracy = Math.round(unitStats[u].correct / unitStats[u].total * 100);
  });

  // 오답 목록
  const wrongIds = answers.filter(a => !a.correct).map(a => a.id);

  // LocalStorage 저장
  const LEVEL_NAMES_MAP = {'quiz0.json':'기초','quiz1.json':'초급1','quiz2.json':'초급2','quiz3.json':'중급1','quiz4.json':'중급2'};
  saveAttempt({
    studentName,
    empId,
    quizLevel: LEVEL_NAMES_MAP[selectedQuizFile] || selectedQuizFile,
    attemptId: sessionAttemptId,
    date: new Date().toLocaleString('ko-KR'),
    quizMode,
    selectedUnits: quizMode === 'unit' ? selectedUnits : [],
    score,
    accuracy,
    totalQuestions: total,
    correctCount,
    wrongQuestions: wrongIds,
    unitStats
  });

  // 결과 화면 렌더링
  document.getElementById('resultScore').textContent = score;
  document.getElementById('resultAccuracy').textContent = accuracy + '%';
  document.getElementById('resultCorrect').textContent = `${correctCount}/${total}`;

  const grade = accuracy >= 90 ? 'S' : accuracy >= 80 ? 'A' : accuracy >= 70 ? 'B' : accuracy >= 60 ? 'C' : 'D';
  document.getElementById('resultGrade').textContent = grade;

  const msgs = { S:'완벽해요! 👏', A:'훌륭합니다! 🎉', B:'잘 했어요! 😊', C:'조금 더 공부해요! 📚', D:'다시 복습해 보세요! 💪' };
  document.getElementById('resultMessage').textContent = msgs[grade];

  // 단원별 결과
  const uStatsEl = document.getElementById('unitStats');
  uStatsEl.innerHTML = '';
  if (Object.keys(unitStats).length === 0) {
    uStatsEl.innerHTML = '<p style="color:var(--muted);font-size:0.9rem;">데이터 없음</p>';
  } else {
    Object.entries(unitStats).sort((a,b) => a[1].accuracy - b[1].accuracy).forEach(([unit, st]) => {
      const shortUnit = unit.split(':')[0];
      uStatsEl.innerHTML += `
        <div class="unit-row">
          <span style="min-width:70px;font-size:0.85rem;font-weight:600;">${shortUnit}</span>
          <div class="unit-bar-wrap"><div class="unit-bar" style="width:${st.accuracy}%;background:${st.accuracy >= 70 ? 'var(--success)' : 'var(--warning)'}"></div></div>
          <span class="unit-pct">${st.accuracy}%</span>
          <span style="font-size:0.8rem;color:var(--muted);">${st.correct}/${st.total}</span>
        </div>
      `;
    });
  }

  // 오답 목록
  const wrongCard = document.getElementById('wrongListCard');
  const wrongListEl = document.getElementById('wrongList');
  const wrongAnswers = answers.filter(a => !a.correct);
  if (wrongAnswers.length > 0) {
    wrongCard.style.display = 'block';
    wrongListEl.innerHTML = '';
    wrongAnswers.forEach(a => {
      const q = quizQuestions.find(q => q.id === a.id);
      wrongListEl.innerHTML += `
        <div class="wrong-item">
          <div class="wrong-q">${q.question}</div>
          <div class="wrong-ans">내 답: <strong>${a.chosen}</strong> → 정답: <strong>${a.answer}</strong></div>
        </div>
      `;
    });
    document.getElementById('retryWrongBtn').style.display = 'block';
  } else {
    wrongCard.style.display = 'none';
    document.getElementById('retryWrongBtn').style.display = 'none';
  }

  showScreen('screenResult');
}

// ────────────────────────────────
// 결과 화면 액션
// ────────────────────────────────
function restartSame() {
  currentIdx = 0;
  answers = [];
  sessionAttemptId = Date.now().toString();
  shuffle(quizQuestions);
  showScreen('screenQuiz');
  renderQuestion();
}

async function retryWrong() {
  const wrongAnswers = answers.filter(a => !a.correct);
  if (wrongAnswers.length === 0) return;

  document.getElementById('loadingOverlay').style.display = 'flex';
  document.querySelector('#loadingOverlay div:last-child').textContent = '유사 문제를 생성 중입니다...';

  let newQuestions = [];
  for (const ans of wrongAnswers) {
    const originalQ = allQuestions.find(q => q.id === ans.id);
    try {
      const newQ = await generateSimilarQuestion(originalQ);
      if (newQ) newQuestions.push(newQ);
    } catch (e) {
      console.error('생성 실패:', originalQ?.id, e);
    }
  }

  document.getElementById('loadingOverlay').style.display = 'none';

  if (newQuestions.length > 0) {
    quizQuestions = newQuestions;
  } else {
    alert('유사 문제 생성에 실패했습니다. 기존 문제로 진행합니다.');
    const wrongIds = wrongAnswers.map(a => a.id);
    quizQuestions = allQuestions.filter(q => wrongIds.includes(q.id));
    shuffle(quizQuestions);
  }

  currentIdx = 0;
  answers = [];
  sessionAttemptId = Date.now().toString();
  quizMode = 'wrong';
  document.getElementById('quizTitle').textContent = newQuestions.length > 0 ? 'AI 생성 오답 복습' : '오답 복습 퀴즈';
  showScreen('screenQuiz');
  renderQuestion();
}

function goHome() {
  showScreen('screenStart');
}

}

function saveAttempt(data) {
  const all = getAllAttempts();
  all.push(data);
  localStorage.setItem('kq_attempts', JSON.stringify(all));

  // 🚨 최종 우회 전송 방식 (보안 차단 원천 봉쇄)
  fetch(GOOGLE_SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: {
      'Content-Type': 'application/x-www-form-urlencoded'
    },
    body: new URLSearchParams({ data: JSON.stringify(data) })
  }).then(() => console.log('전송 시도 완료')).catch(e => console.error(e));
}

function getMyWrongIds() {
  const attempts = getAllAttempts().filter(a => a.studentName === studentName && a.empId === empId);
  const wrongSet = new Set();
  attempts.forEach(a => a.wrongQuestions.forEach(id => wrongSet.add(id)));
  return [...wrongSet];
}

async function renderHistory() {

  const eid  = document.getElementById('inputEmpId').value.trim() || localStorage.getItem('kq_last_empid') || '';

  } else {

  }

  if (myAttempts.length === 0) {
    myList.innerHTML = `<div class="empty-state"><div class="empty-icon">📋</div>아직 기록이 없어요.<br>퀴즈를 풀어보세요!</div>`;
  } else {
    myList.innerHTML = myAttempts.map(a => renderHistoryCard(a)).join('');
  }

  // 3. 전체 기록 탭 렌더링
  const allList = document.getElementById('allHistoryList');
  if (all.length === 0) {
    allList.innerHTML = `<div class="empty-state"><div class="empty-icon">📋</div>기록이 없습니다.</div>`;
  } else {
    const grouped = {};
    [...all].reverse().forEach(a => {

    });
    allList.innerHTML = Object.values(grouped).map(({ name, eid, list: attempts }) => `
      <div class="card" style="padding:14px 16px;">
        <div style="font-weight:700; margin-bottom:8px;">👤 ${name}${eid ? ` <span style="font-weight:400;color:var(--muted);font-size:0.85rem;">(${eid})</span>` : ''} · ${attempts.length}회</div>
        ${attempts.slice(0,3).map(a => renderHistoryCard(a, true)).join('')}

      </div>
    `).join('');
  }
} // 함수의 끝 중괄호 확인

function renderHistoryCard(a, compact = false) {
  const grade = a.accuracy >= 90 ? 'S' : a.accuracy >= 80 ? 'A' : a.accuracy >= 70 ? 'B' : a.accuracy >= 60 ? 'C' : 'D';
  const modeLabel = { all: '전체', unit: '단원별', wrong: '오답' };
  if (compact) {
    return `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:0.9rem;">
      <span>${a.date}</span>
      <span>${modeLabel[a.quizMode]||a.quizMode} | ${a.correctCount}/${a.totalQuestions} (${a.accuracy}%) <strong>${grade}</strong></span>
    </div>`;
  }
  const weakUnits = Object.entries(a.unitStats || {})
    .filter(([,v]) => v.accuracy < 60).map(([k]) => k.split(':')[0]).join(', ');
  return `
    <div class="history-card">
      <div class="history-meta">
        <div>
          <span class="history-score">${a.score}점</span>
          <span style="margin-left:8px;font-size:0.85rem;color:var(--muted);">${grade}등급 · ${a.accuracy}%</span>
        </div>
        <span class="history-date">${a.date}</span>
      </div>
      <div style="margin-top:8px;font-size:0.85rem;color:var(--muted);">
        📝 ${modeLabel[a.quizMode]||a.quizMode} · ${a.correctCount}/${a.totalQuestions} 정답
        ${weakUnits ? `<br>⚠️ 취약 단원: ${weakUnits}` : ''}
      </div>
    </div>
  `;
}

function switchTab(tab) {

  document.getElementById('tabAll').classList.toggle('active', tab === 'all');
  document.getElementById('tabContentMine').style.display = tab === 'mine' ? 'block' : 'none';
  document.getElementById('tabContentAll').style.display = tab === 'all' ? 'block' : 'none';

function exportCSV() {
  const all = getAllAttempts();
  if (all.length === 0) { alert('내보낼 데이터가 없습니다.'); return; }

  const headers = ['학생이름', '사번', '시도ID', '날짜', '퀴즈모드', '점수', '정답률', '전체문제', '정답수', '틀린문제수'];
  const rows = all.map(a => [
    a.studentName,
    a.empId || '',
    a.attemptId,
    a.date,
    a.quizMode,
    a.score,
    a.accuracy + '%',
    a.totalQuestions,
    a.correctCount,
    a.wrongQuestions.length
  ]);

  const csv = '﻿' + [headers, ...rows].map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `퀴즈기록_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

function clearAllData() {
  if (!confirm('모든 학습 기록이 삭제됩니다. 정말 초기화하시겠어요?')) return;
  localStorage.removeItem('kq_attempts');

  alert('초기화 완료!');
}

// 유틸리티
// ────────────────────────────────
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

async function generateSimilarQuestion(wrongQuestion) {
  const { GoogleGenerativeAI } = await import('https://esm.run/@google/generative-ai');
  const genAI = new GoogleGenerativeAI(GEMINI_API_KEY);
  const model = genAI.getGenerativeModel({ model: 'gemini-1.5-flash' });

  const prompt = `당신은 한국어 선생님입니다. 학생이 다음 문제를 틀렸습니다.
내용: ${wrongQuestion.question}
정답: ${wrongQuestion.answer}
난이도: ${wrongQuestion.level}
단원: ${wrongQuestion.unit}

위 문제와 유사한 유형의 새로운 한국어 학습 문제를 1개 만들어주세요.
반드시 아래 JSON 형식으로만 응답하세요.
{
  "unit": "${wrongQuestion.unit}",
  "level": "${wrongQuestion.level}",
  "type": "${wrongQuestion.type}",
  "question": "문제 내용",
  "choices": ["보기1", "보기2", "보기3", "보기4"],
  "answer": "정답 내용",
  "explanation": "해설 내용"
}`;

  const result = await model.generateContent(prompt);
  const text = result.response.text();
  const jsonMatch = text.match(/\{[\s\S]*\}/);
  if (!jsonMatch) throw new Error('JSON 파싱 실패');
  return JSON.parse(jsonMatch[0]);
}

async function generateAISimilarQuestions() {
  const btn = document.getElementById('aiGenerateBtn');
  const card = document.getElementById('aiGeneratedCard');
  const list = document.getElementById('aiGeneratedList');

  const wrongAnswers = answers.filter(a => !a.correct);
  if (wrongAnswers.length === 0) return;

  btn.disabled = true;
  btn.textContent = '⏳ 생성 중...';
  card.style.display = 'block';
  list.innerHTML = '<p style="color:var(--muted);text-align:center;padding:16px 0;">AI가 유사문제를 생성하고 있습니다...</p>';

  const generated = [];
  for (const a of wrongAnswers) {
    const q = quizQuestions.find(q => q.id === a.id);
    if (!q) continue;
    try {
      const newQ = await generateSimilarQuestion(q);
      if (newQ) generated.push(newQ);
    } catch (e) {
      console.error('생성 실패:', q.id, e);
    }
  }

  if (generated.length === 0) {
    list.innerHTML = '<p style="color:var(--danger);text-align:center;padding:16px 0;">유사문제 생성에 실패했습니다.</p>';
  } else {
    list.innerHTML = generated.map((q, i) => `
      <div class="ai-question-item">
        <div class="ai-q-num">문제 ${i + 1} · ${q.unit} · ${q.level}</div>
        <div class="ai-q-text">${q.question}</div>
        <ol class="ai-choices">
          ${q.choices.map(c => `<li class="${c === q.answer ? 'ai-correct' : ''}">${c}</li>`).join('')}
        </ol>
        <div class="ai-explanation">💡 ${q.explanation}</div>
      </div>
    `).join('');
  }

  btn.disabled = false;
  btn.textContent = '🔄 다시 생성';
}
