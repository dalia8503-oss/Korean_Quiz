<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>교사용 관리 패널 - 한국어 퀴즈</title>
  <style>
    :root {
      --primary: #7c3aed;
      --primary-dark: #6d28d9;
      --success: #16a34a;
      --danger: #dc2626;
      --warning: #d97706;
      --bg: #f5f3ff;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --radius: 14px;
      --shadow: 0 4px 20px rgba(0,0,0,0.07);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans KR', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    header {
      background: var(--primary); color: #fff;
      padding: 16px 24px; display: flex; align-items: center; gap: 12px;
      box-shadow: 0 2px 8px rgba(124,58,237,0.3);
    }
    header h1 { font-size: 1.2rem; font-weight: 800; }
    header .badge { background: rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 99px; font-size: 0.8rem; }

    main { max-width: 900px; margin: 0 auto; padding: 20px 16px; }

    .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; margin-bottom: 16px; }
    h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
    h3 { font-size: 0.95rem; font-weight: 700; margin-bottom: 8px; color: var(--muted); }

    .btn {
      padding: 10px 18px; border: none; border-radius: 10px;
      font-size: 0.9rem; font-weight: 700; cursor: pointer; transition: all 0.15s;
    }
    .btn:hover { opacity: 0.88; }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-outline { background: none; border: 2px solid var(--primary); color: var(--primary); }
    .btn-gray { background: var(--border); color: var(--text); }
    .btn-sm { padding: 6px 12px; font-size: 0.8rem; }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

    .upload-zone {
      border: 2px dashed var(--border); border-radius: 12px;
      padding: 32px; text-align: center; cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .upload-zone:hover, .upload-zone.drag-over {
      border-color: var(--primary); background: #f5f3ff;
    }
    .upload-zone .icon { font-size: 2.5rem; margin-bottom: 8px; }
    .upload-zone p { color: var(--muted); font-size: 0.9rem; margin-bottom: 12px; }

    input[type="file"] { display: none; }

    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th { background: var(--bg); padding: 10px 12px; text-align: left; font-weight: 700; border-bottom: 2px solid var(--border); }
    td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
    tr:hover td { background: #fafafa; }

    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 0.75rem; font-weight: 700;
    }
    .badge-easy { background: #dcfce7; color: #15803d; }
    .badge-medium { background: #fef9c3; color: #a16207; }
    .badge-hard { background: #fee2e2; color: #b91c1c; }
    .badge-mc { background: #eff6ff; color: #1d4ed8; }
    .badge-tf { background: #f0fdf4; color: #166534; }
    .badge-fb { background: #fff7ed; color: #c2410c; }
    .badge-vo { background: #fdf4ff; color: #86198f; }
    .badge-si { background: #f0f9ff; color: #0369a1; }
    .badge-re { background: #fef2f2; color: #991b1b; }

    .q-preview {
      background: #f8fafc; border-radius: 10px; padding: 14px;
      margin-bottom: 10px; border: 1px solid var(--border);
    }
    .q-preview .q-text { font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; }
    .q-preview .q-choices { color: var(--muted); font-size: 0.82rem; }
    .q-preview .q-answer { color: var(--success); font-weight: 700; font-size: 0.85rem; margin-top: 4px; }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .stat-box { background: var(--bg); border-radius: 10px; padding: 14px; text-align: center; }
    .stat-box .val { font-size: 1.6rem; font-weight: 800; color: var(--primary); }
    .stat-box .lbl { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }

    .alert { padding: 12px 16px; border-radius: 10px; margin-bottom: 12px; font-size: 0.9rem; }
    .alert-success { background: #f0fdf4; color: var(--success); border: 1px solid #bbf7d0; }
    .alert-error { background: #fef2f2; color: var(--danger); border: 1px solid #fecaca; }
    .alert-info { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }

    textarea {
      width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: 10px;
      font-size: 0.9rem; resize: vertical; font-family: monospace; outline: none;
    }
    textarea:focus { border-color: var(--primary); }

    .tab-bar { display: flex; gap: 4px; background: var(--border); border-radius: 10px; padding: 4px; margin-bottom: 16px; }
    .tab-btn { flex: 1; padding: 9px; border: none; border-radius: 8px; background: none; font-size: 0.9rem; font-weight: 600; cursor: pointer; color: var(--muted); transition: all 0.15s; }
    .tab-btn.active { background: #fff; color: var(--primary); box-shadow: 0 2px 8px rgba(0,0,0,0.08); }

    #msgArea { min-height: 20px; }
    .pagination { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 12px; }
    .page-btn { padding: 5px 10px; border: 1px solid var(--border); border-radius: 6px; background: #fff; cursor: pointer; font-size: 0.82rem; }
    .page-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    @media (max-width: 600px) {
      table, thead, tbody, th, td, tr { display: block; }
      th { display: none; }
      td { border: none; padding: 4px 0; }
      td::before { font-weight: 700; content: attr(data-label) ": "; }
    }
  </style>
</head>
<body>
<header>
  <span style="font-size:1.8rem;">🎓</span>
  <div>
    <h1>교사용 관리 패널</h1>
    <p style="font-size:0.8rem;opacity:0.8;">한국어·문화 퀴즈 관리 도구</p>
  </div>
  <div style="margin-left:auto;">
    <a href="index.html" class="badge">← 학생 앱으로</a>
  </div>
</header>

<main>

  <!-- 레벨 선택 -->
  <div class="card" style="padding:12px 16px;margin-bottom:12px;">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
      <span style="font-weight:700;font-size:0.9rem;">📘 레벨 선택:</span>
      <div style="display:flex;gap:6px;flex-wrap:wrap;" id="teacherLevelGroup">
        <button class="btn btn-primary btn-sm" onclick="selectTeacherLevel(this,'quiz1')">기초</button>
        <button class="btn btn-gray btn-sm" onclick="selectTeacherLevel(this,'quiz2')">초급1</button>
        <button class="btn btn-gray btn-sm" onclick="selectTeacherLevel(this,'quiz3')">초급2</button>
        <button class="btn btn-gray btn-sm" onclick="selectTeacherLevel(this,'quiz4')">중급1</button>
        <button class="btn btn-gray btn-sm" onclick="selectTeacherLevel(this,'quiz5')">중급2</button>
      </div>
    </div>
  </div>

  <!-- 탭 -->
  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('questions')" id="tab-questions">📚 문제 관리</button>
    <button class="tab-btn" onclick="switchTab('records')" id="tab-records">📊 학생 기록</button>
    <button class="tab-btn" onclick="switchTab('upload')" id="tab-upload">⬆️ 문제 업로드</button>
  </div>

  <!-- ─── 탭 1: 문제 관리 ─── -->
  <div id="panel-questions">
    <div id="msgArea"></div>

    <div class="card">
      <h2>📊 문제은행 현황</h2>
      <div class="stats-grid" id="statsGrid"></div>
      <div class="btn-row">
        <button class="btn btn-success" onclick="loadAndRenderQuestions()">🔄 새로고침</button>
        <button class="btn btn-outline" onclick="downloadQuestions()">💾 JSON 다운로드</button>
      </div>
    </div>

    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:12px;">
        <h2 style="margin:0;">📋 문제 목록</h2>
        <div class="btn-row">
          <select id="filterUnit" onchange="filterQuestions()" style="padding:6px 10px;border:1px solid var(--border);border-radius:8px;font-size:0.85rem;">
            <option value="">전체 단원</option>
          </select>
          <select id="filterLevel" onchange="filterQuestions()" style="padding:6px 10px;border:1px solid var(--border);border-radius:8px;font-size:0.85rem;">
            <option value="">전체 난이도</option>
            <option value="easy">쉬움</option>
            <option value="medium">보통</option>
            <option value="hard">어려움</option>
          </select>
        </div>
      </div>
      <div id="questionTable"></div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>

  <!-- ─── 탭 2: 학생 기록 ─── -->
  <div id="panel-records" style="display:none;">
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:14px;">
        <h2 style="margin:0;">📊 전체 학생 기록</h2>
        <div class="btn-row">
          <button class="btn btn-success btn-sm" onclick="exportCSV()">📥 CSV 내보내기</button>
          <button class="btn btn-danger btn-sm" onclick="clearAll()">🗑 전체 초기화</button>
        </div>
      </div>
      <div id="recordStats" class="stats-grid"></div>
      <div id="recordTable"></div>
    </div>
  </div>

  <!-- ─── 탭 3: 문제 업로드 ─── -->
  <div id="panel-upload" style="display:none;">
    <div class="card">
      <h2>⬆️ 문제 JSON 업로드</h2>
      <p style="color:var(--muted);font-size:0.9rem;margin-bottom:14px;">
        questions.json 파일을 업로드하거나, 아래 텍스트 영역에 JSON을 직접 붙여넣기 하세요.
      </p>

      <div class="upload-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <div class="icon">📂</div>
        <p>클릭하거나 파일을 여기에 끌어다 놓으세요<br><strong>questions.json</strong> 파일만 지원</p>
        <button class="btn btn-primary" onclick="event.stopPropagation(); document.getElementById('fileInput').click()">파일 선택</button>
      </div>
      <input type="file" id="fileInput" accept=".json" onchange="handleFileUpload(event)">

      <div style="margin: 16px 0; text-align:center; color:var(--muted);">— 또는 직접 붙여넣기 —</div>

      <textarea id="jsonInput" rows="8" placeholder='[{"id":"q001","unit":"1단원","question":"...","answer":"...",...}]'></textarea>

      <div class="btn-row" style="margin-top:10px;">
        <button class="btn btn-primary" onclick="validateAndPreview()">👁 미리보기 및 검증</button>
        <button class="btn btn-success" onclick="saveQuestions()">💾 저장(localStorage)</button>
        <button class="btn btn-gray" onclick="document.getElementById('jsonInput').value=''">초기화</button>
      </div>

      <div id="uploadMsg" style="margin-top:12px;"></div>
      <div id="uploadPreview" style="margin-top:12px;"></div>
    </div>

    <div class="card">
      <h2>📝 문제 직접 추가</h2>
      <div style="display:grid;gap:10px;">
        <div>
          <label style="font-size:0.85rem;font-weight:600;">단원명</label>
          <input type="text" id="newUnit" placeholder="예: 1단원: 인사와 소개" style="width:100%;padding:10px;border:2px solid var(--border);border-radius:8px;font-size:0.9rem;margin-top:4px;outline:none;">
        </div>
        <div>
          <label style="font-size:0.85rem;font-weight:600;">문제</label>
          <textarea id="newQuestion" rows="3" placeholder="문제를 입력하세요"></textarea>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          <div>
            <label style="font-size:0.85rem;font-weight:600;">선택지 (줄바꿈으로 구분)</label>
            <textarea id="newChoices" rows="4" placeholder="선택지1&#10;선택지2&#10;선택지3&#10;선택지4"></textarea>
          </div>
          <div>
            <label style="font-size:0.85rem;font-weight:600;">정답</label>
            <input type="text" id="newAnswer" placeholder="정확히 선택지 중 하나" style="width:100%;padding:10px;border:2px solid var(--border);border-radius:8px;font-size:0.9rem;margin-top:4px;outline:none;">
            <label style="font-size:0.85rem;font-weight:600;display:block;margin-top:8px;">난이도</label>
            <select id="newLevel" style="width:100%;padding:10px;border:2px solid var(--border);border-radius:8px;font-size:0.9rem;margin-top:4px;">
              <option value="easy">쉬움</option>
              <option value="medium" selected>보통</option>
              <option value="hard">어려움</option>
            </select>
            <label style="font-size:0.85rem;font-weight:600;display:block;margin-top:8px;">유형</label>
            <select id="newType" style="width:100%;padding:10px;border:2px solid var(--border);border-radius:8px;font-size:0.9rem;margin-top:4px;">
              <option value="multiple_choice">객관식</option>
              <option value="true_false">O/X</option>
              <option value="fill_blank">빈칸 채우기</option>
              <option value="vocabulary">어휘</option>
              <option value="situation">상황 표현</option>
              <option value="reading">독해</option>
            </select>
          </div>
        </div>
        <div>
          <label style="font-size:0.85rem;font-weight:600;">해설</label>
          <textarea id="newExplanation" rows="3" placeholder="정답 해설을 입력하세요"></textarea>
        </div>
        <button class="btn btn-primary" onclick="addNewQuestion()">➕ 문제 추가</button>
        <div id="addMsg"></div>
      </div>
    </div>
  </div>

</main>

<script>
// ─── 상태 ───
let loadedQuestions = [];
let filteredQuestions = [];
let currentPage = 1;
const PAGE_SIZE = 10;
let selectedTeacherFile = 'quiz1';
const LEVEL_NAMES = { quiz1:'기초', quiz2:'초급1', quiz3:'초급2', quiz4:'중급1', quiz5:'중급2' };
function getOverrideKey() { return 'kq_questions_override_' + selectedTeacherFile; }
function selectTeacherLevel(btn, level) {
  document.querySelectorAll('#teacherLevelGroup .btn').forEach(b => {
    b.className = b.className.replace('btn-primary', 'btn-gray');
  });
  btn.className = btn.className.replace('btn-gray', 'btn-primary');
  selectedTeacherFile = level;
  loadAndRenderQuestions();
}

// ─── 초기화 ───
document.addEventListener('DOMContentLoaded', () => {
  loadAndRenderQuestions();
  setupDragDrop();
});

async function loadAndRenderQuestions() {
  try {
    // 1순위: localStorage 오버라이드
    const cached = localStorage.getItem(getOverrideKey());
    if (cached) {
      loadedQuestions = JSON.parse(cached);
      showMsg(`localStorage에서 불러왔습니다. [${LEVEL_NAMES[selectedTeacherFile]}]`, 'info');
    } else {
      const res = await fetch(selectedTeacherFile + '.json');
      loadedQuestions = await res.json();
    }
    filteredQuestions = [...loadedQuestions];
    renderStats();
    buildUnitFilter();
    renderTable();
  } catch (e) {
    showMsg('questions.json을 불러오지 못했습니다: ' + e.message, 'error');
  }
}

function renderStats() {
  const total = loadedQuestions.length;
  const byLevel = { easy: 0, medium: 0, hard: 0 };
  const byType = {};
  loadedQuestions.forEach(q => {
    byLevel[q.level] = (byLevel[q.level]||0) + 1;
    byType[q.type] = (byType[q.type]||0) + 1;
  });
  const units = new Set(loadedQuestions.map(q => q.unit)).size;

  document.getElementById('statsGrid').innerHTML = `
    <div class="stat-box"><div class="val">${total}</div><div class="lbl">전체 문항</div></div>
    <div class="stat-box"><div class="val">${units}</div><div class="lbl">단원 수</div></div>
    <div class="stat-box" style="background:#dcfce7;"><div class="val" style="color:#15803d;">${byLevel.easy||0}</div><div class="lbl">쉬움</div></div>
    <div class="stat-box" style="background:#fef9c3;"><div class="val" style="color:#a16207;">${byLevel.medium||0}</div><div class="lbl">보통</div></div>
    <div class="stat-box" style="background:#fee2e2;"><div class="val" style="color:#b91c1c;">${byLevel.hard||0}</div><div class="lbl">어려움</div></div>
  `;
}

function buildUnitFilter() {
  const units = [...new Set(loadedQuestions.map(q => q.unit))].sort();
  const sel = document.getElementById('filterUnit');
  sel.innerHTML = '<option value="">전체 단원</option>' +
    units.map(u => `<option value="${u}">${u}</option>`).join('');
}

function filterQuestions() {
  const unit = document.getElementById('filterUnit').value;
  const level = document.getElementById('filterLevel').value;
  filteredQuestions = loadedQuestions.filter(q =>
    (!unit || q.unit === unit) && (!level || q.level === level)
  );
  currentPage = 1;
  renderTable();
}

function renderTable() {
  const start = (currentPage - 1) * PAGE_SIZE;
  const pageItems = filteredQuestions.slice(start, start + PAGE_SIZE);
  const typeBadge = { multiple_choice:'badge-mc', true_false:'badge-tf', fill_blank:'badge-fb', vocabulary:'badge-vo', situation:'badge-si', reading:'badge-re' };
  const typeLabel = { multiple_choice:'객관식', true_false:'O/X', fill_blank:'빈칸', vocabulary:'어휘', situation:'상황', reading:'독해' };

  if (filteredQuestions.length === 0) {
    document.getElementById('questionTable').innerHTML = '<p style="color:var(--muted);padding:20px 0;">조건에 맞는 문제가 없습니다.</p>';
    document.getElementById('pagination').innerHTML = '';
    return;
  }

  const rows = pageItems.map((q, i) => `
    <tr>
      <td data-label="번호">${start+i+1}</td>
      <td data-label="ID" style="font-family:monospace;font-size:0.78rem;">${q.id}</td>
      <td data-label="단원" style="font-size:0.82rem;">${q.unit.split(':')[0]}</td>
      <td data-label="문제">${q.question.length > 50 ? q.question.slice(0,50)+'...' : q.question}</td>
      <td data-label="난이도"><span class="badge badge-${q.level}">${q.level==='easy'?'쉬움':q.level==='medium'?'보통':'어려움'}</span></td>
      <td data-label="유형"><span class="badge ${typeBadge[q.type]||''}">${typeLabel[q.type]||q.type}</span></td>
      <td data-label="정답" style="font-size:0.82rem;color:var(--success);font-weight:700;">${q.answer}</td>
      <td><button class="btn btn-gray btn-sm" onclick="deleteQuestion('${q.id}')">삭제</button></td>
    </tr>
  `).join('');

  document.getElementById('questionTable').innerHTML = `
    <table>
      <thead><tr><th>#</th><th>ID</th><th>단원</th><th>문제</th><th>난이도</th><th>유형</th><th>정답</th><th>관리</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;

  const totalPages = Math.ceil(filteredQuestions.length / PAGE_SIZE);
  const pages = [];
  for (let p = 1; p <= totalPages; p++) {
    pages.push(`<button class="page-btn${p===currentPage?' active':''}" onclick="goPage(${p})">${p}</button>`);
  }
  document.getElementById('pagination').innerHTML = `<span style="font-size:0.85rem;color:var(--muted);align-self:center;">${filteredQuestions.length}개</span>` + pages.join('');
}

function goPage(p) { currentPage = p; renderTable(); }

function deleteQuestion(id) {
  if (!confirm('이 문제를 삭제하시겠어요?')) return;
  loadedQuestions = loadedQuestions.filter(q => q.id !== id);
  filteredQuestions = filteredQuestions.filter(q => q.id !== id);
  localStorage.setItem(getOverrideKey(), JSON.stringify(loadedQuestions));
  renderStats();
  renderTable();
  showMsg('문제가 삭제되었습니다.', 'success');
}

function downloadQuestions() {
  const blob = new Blob([JSON.stringify(loadedQuestions, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = selectedTeacherFile + '.json'; a.click();
  URL.revokeObjectURL(url);
}

// ─── 문제 업로드 ───
function handleFileUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    document.getElementById('jsonInput').value = e.target.result;
    validateAndPreview();
  };
  reader.readAsText(file);
}

function setupDragDrop() {
  const zone = document.getElementById('dropZone');
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
  zone.addEventListener('drop', e => {
    e.preventDefault(); zone.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      document.getElementById('jsonInput').value = ev.target.result;
      validateAndPreview();
    };
    reader.readAsText(file);
  });
}

function validateAndPreview() {
  const raw = document.getElementById('jsonInput').value.trim();
  const msgEl = document.getElementById('uploadMsg');
  const previewEl = document.getElementById('uploadPreview');

  if (!raw) { msgEl.innerHTML = '<div class="alert alert-error">JSON이 비어 있습니다.</div>'; return; }

  let data;
  try { data = JSON.parse(raw); } catch (e) {
    msgEl.innerHTML = `<div class="alert alert-error">JSON 파싱 오류: ${e.message}</div>`; return;
  }

  if (!Array.isArray(data)) { msgEl.innerHTML = '<div class="alert alert-error">최상위 요소가 배열이어야 합니다.</div>'; return; }

  const required = ['id', 'unit', 'question', 'choices', 'answer'];
  const errors = [];
  data.forEach((q, i) => {
    required.forEach(f => { if (!q[f]) errors.push(`문제 ${i+1}: '${f}' 필드 누락`); });
  });

  if (errors.length > 0) {
    msgEl.innerHTML = `<div class="alert alert-error">⚠️ ${errors.slice(0,5).join('<br>')}${errors.length>5?`<br>외 ${errors.length-5}건...`:''}</div>`;
  } else {
    msgEl.innerHTML = `<div class="alert alert-success">✅ ${data.length}개 문제 검증 통과!</div>`;
  }

  previewEl.innerHTML = '<h3 style="margin-bottom:10px;">미리보기 (처음 3개)</h3>' +
    data.slice(0,3).map(q => `
      <div class="q-preview">
        <div class="q-text">${q.question}</div>
        <div class="q-choices">선택지: ${q.choices.join(' / ')}</div>
        <div class="q-answer">정답: ${q.answer}</div>
      </div>
    `).join('');
}

function saveQuestions() {
  const raw = document.getElementById('jsonInput').value.trim();
  try {
    const data = JSON.parse(raw);
    localStorage.setItem(getOverrideKey(), JSON.stringify(data));
    document.getElementById('uploadMsg').innerHTML = `<div class="alert alert-success">✅ ${data.length}개 문제가 저장되었습니다. [${LEVEL_NAMES[selectedTeacherFile]}]</div>`;
    loadAndRenderQuestions();
    switchTab('questions');
  } catch (e) {
    document.getElementById('uploadMsg').innerHTML = `<div class="alert alert-error">저장 실패: ${e.message}</div>`;
  }
}

// ─── 문제 직접 추가 ───
function addNewQuestion() {
  const unit = document.getElementById('newUnit').value.trim();
  const question = document.getElementById('newQuestion').value.trim();
  const choicesRaw = document.getElementById('newChoices').value.trim();
  const answer = document.getElementById('newAnswer').value.trim();
  const level = document.getElementById('newLevel').value;
  const type = document.getElementById('newType').value;
  const explanation = document.getElementById('newExplanation').value.trim();
  const msgEl = document.getElementById('addMsg');

  if (!unit || !question || !choicesRaw || !answer) {
    msgEl.innerHTML = '<div class="alert alert-error">단원명, 문제, 선택지, 정답은 필수입니다.</div>'; return;
  }
  const choices = choicesRaw.split('\n').map(s => s.trim()).filter(Boolean);
  if (choices.length < 2) { msgEl.innerHTML = '<div class="alert alert-error">선택지를 2개 이상 입력하세요.</div>'; return; }
  if (!choices.includes(answer)) { msgEl.innerHTML = '<div class="alert alert-error">정답이 선택지 중에 없습니다.</div>'; return; }

  const newQ = {
    id: 'q' + Date.now(),
    unit, topic: '', level, type, question, choices, answer,
    explanation: explanation || '해설 없음',
    sourceNote: '교사 직접 입력'
  };
  loadedQuestions.push(newQ);
  localStorage.setItem(getOverrideKey(), JSON.stringify(loadedQuestions));
  filteredQuestions = [...loadedQuestions];
  renderStats();
  buildUnitFilter();
  renderTable();
  msgEl.innerHTML = '<div class="alert alert-success">✅ 문제가 추가되었습니다!</div>';
  ['newUnit','newQuestion','newChoices','newAnswer','newExplanation'].forEach(id => document.getElementById(id).value = '');
}

// ─── 학생 기록 ───
// 복사한 구글 웹 앱 URL을 여기에 넣으세요
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxHXTJ2Np_VwVvZmowmGisu6kSvkymkXBoK6wVih-hn2rarC1oDQsNYQQpeoLbBDSMG/exec";

async function fetchAllRecords() {
  try {
    // 이제 로컬이 아닌 구글 스프레드시트(웹 앱)에서 데이터를 가져옵니다.
    const res = await fetch(GOOGLE_SCRIPT_URL);
    if (res.ok) {
      return await res.json();
    }
  } catch (e) {
    console.error("데이터 로드 실패:", e);
  }
  // 서버 연결 실패 시 내 기기(브라우저) 기록이라도 보여줍니다.
  return JSON.parse(localStorage.getItem('kq_attempts') || '[]');
}

const LEVEL_BADGE = { '기초':'#eff6ff|#1d4ed8', '초급1':'#f0fdf4|#15803d', '초급2':'#fef9c3|#a16207', '중급1':'#fff7ed|#c2410c', '중급2':'#fdf4ff|#86198f' };
function levelBadge(lvl) {
  const [bg, color] = (LEVEL_BADGE[lvl] || '#f1f5f9|#64748b').split('|');
  return `<span style="background:${bg};color:${color};padding:2px 8px;border-radius:99px;font-size:0.75rem;font-weight:700;">${lvl||'-'}</span>`;
}

async function renderRecords() {
  const all = await fetchAllRecords();
  const statsEl = document.getElementById('recordStats');
  const tableEl = document.getElementById('recordTable');

  const students = [...new Set(all.map(a => `${a.studentName}__${a.empId||''}`))];
  const avgScore = all.length > 0 ? Math.round(all.reduce((s,a) => s+a.score, 0)/all.length) : 0;

  // 레벨별 시도 횟수
  const byLevel = {};
  all.forEach(a => { const lv = a.quizLevel||'-'; byLevel[lv] = (byLevel[lv]||0)+1; });
  const levelSummary = Object.entries(byLevel).map(([lv,cnt]) => `${lv} ${cnt}회`).join(' · ');

  statsEl.innerHTML = `
    <div class="stat-box"><div class="val">${all.length}</div><div class="lbl">총 시도 횟수</div></div>
    <div class="stat-box"><div class="val">${students.length}</div><div class="lbl">학생 수</div></div>
    <div class="stat-box"><div class="val">${avgScore}</div><div class="lbl">평균 점수</div></div>
    <div class="stat-box" style="grid-column:1/-1;text-align:left;padding:12px 14px;">
      <div class="lbl" style="margin-bottom:4px;">레벨별 응시</div>
      <div style="font-size:0.9rem;font-weight:600;">${levelSummary||'-'}</div>
    </div>
  `;

  if (all.length === 0) {
    tableEl.innerHTML = '<p style="color:var(--muted);padding:20px 0;">학생 기록이 없습니다.</p>';
    return;
  }

  const rows = [...all].reverse().map(a => `
    <tr>
      <td data-label="이름">${a.studentName}</td>
      <td data-label="사번" style="font-family:monospace;">${a.empId||'-'}</td>
      <td data-label="레벨">${levelBadge(a.quizLevel)}</td>
      <td data-label="날짜" style="font-size:0.82rem;">${a.date}</td>
      <td data-label="모드">${{all:'전체',unit:'단원별',wrong:'오답'}[a.quizMode]||a.quizMode}</td>
      <td data-label="점수"><strong>${a.score}점</strong></td>
      <td data-label="정답률">${a.accuracy}%</td>
      <td data-label="정답">${a.correctCount}/${a.totalQuestions}</td>
    </tr>
  `).join('');

  tableEl.innerHTML = `
    <table>
      <thead><tr><th>이름</th><th>사번</th><th>레벨</th><th>날짜</th><th>모드</th><th>점수</th><th>정답률</th><th>정답</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

async function exportCSV() {
  const all = await fetchAllRecords();
  if (all.length === 0) { alert('내보낼 데이터가 없습니다.'); return; }
  const headers = ['학생이름', '사번', '레벨', '날짜', '퀴즈모드', '점수', '정답률', '전체문제', '정답수', '틀린문제수'];
  const rows = all.map(a => [a.studentName, a.empId||'', a.quizLevel||'', a.date, a.quizMode, a.score, a.accuracy+'%', a.totalQuestions, a.correctCount, a.wrongQuestions.length]);
  const csv = '﻿' + [headers,...rows].map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `학생기록_${new Date().toISOString().slice(0,10)}.csv`; a.click();
  URL.revokeObjectURL(url);
}

async function clearAll() {
  if (!confirm('모든 학생 기록이 삭제됩니다. 계속하시겠어요?')) return;
  try { await fetch('/api/records', { method: 'DELETE' }); } catch {}
  localStorage.removeItem('kq_attempts');
  renderRecords();
  alert('초기화 완료!');
}

// ─── 탭 전환 ───
function switchTab(tab) {
  ['questions','records','upload'].forEach(t => {
    document.getElementById(`panel-${t}`).style.display = t === tab ? 'block' : 'none';
    document.getElementById(`tab-${t}`).classList.toggle('active', t === tab);
  });
  if (tab === 'records') renderRecords();
}

// ─── 메시지 ───
function showMsg(msg, type) {
  document.getElementById('msgArea').innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
  setTimeout(() => { document.getElementById('msgArea').innerHTML = ''; }, 4000);
}
</script>
